name: macOS compatibility build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test and build for Sonoma and later
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Whisky-unsigned-${{ matrix.os }}
          path: build/artifacts/Whisky-unsigned.zip
          if-no-files-found: error
